# Reusable: supabase db push via --db-url (pooler host + URL-encoded password).
name: supabase-db-push

on:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true
      SUPABASE_PROJECT_REF:
        required: true
      SUPABASE_DB_HOST:
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: supabase db push
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_HOST:-}" ]; then
            echo "Erreur : secret SUPABASE_DB_HOST manquant (ex. aws-1-eu-west-2.pooler.supabase.com)."
            exit 1
          fi
          ENCODED_PASSWORD="$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")"
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_DB_HOST}:5432/postgres"
          supabase db push --db-url "$DB_URL" --yes
